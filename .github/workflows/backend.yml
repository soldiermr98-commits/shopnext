name: Backend and frontend verification

on:
  push:
    branches: [arena/c101d8c3-shopnext]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Storefront and archived security regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install exact frontend lock
        run: bun install --frozen-lockfile
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: PHP ${{ matrix.php }} / MySQL 8
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: shopnext_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: shopnext_ci_test
      DB_USERNAME: root
      DB_PASSWORD: ''
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_mysql, gd, zip, curl, bcmath
          tools: composer:v2
          coverage: none
      - name: Verify actual PHP extensions and MySQL connection
        run: |
          php --version
          composer --version
          php -r 'foreach (["intl","mbstring","pdo_mysql","gd","zip","curl","bcmath"] as $ext) { if (!extension_loaded($ext)) { fwrite(STDERR, "Missing extension: $ext\n"); exit(1); } } $db = new PDO("mysql:host=127.0.0.1;port=3306;dbname=shopnext_ci_test", "root", ""); echo "MySQL ", $db->query("select version()")->fetchColumn(), PHP_EOL;'
      - name: Determine application state without hiding a partial scaffold
        id: app
        shell: bash
        run: |
          if [[ -f backend/composer.json ]]; then
            test -f backend/composer.lock
            test -f backend/artisan
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            test ! -f backend/artisan
            test ! -f backend/composer.lock
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::L0 only: PHP/MySQL runtime verified. Laravel/Pint/Pest/migrations NOT EXECUTED (UNVERIFIED).'
            echo '### L0 baseline only — Laravel UNVERIFIED' >> "$GITHUB_STEP_SUMMARY"
            echo 'PHP/MySQL runtime check only. No application exists; Pint, Pest and migrations are NOT EXECUTED. This is not L1 completion.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Composer cache directory
        if: steps.app.outputs.ready == 'true'
        id: cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.app.outputs.ready == 'true'
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-
      - name: Install committed Composer lock
        if: steps.app.outputs.ready == 'true'
        working-directory: backend
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction --no-progress
          composer check-platform-reqs
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Pint
        if: steps.app.outputs.ready == 'true'
        working-directory: backend
        run: vendor/bin/pint --test
      - name: Migrate dedicated MySQL test database
        if: steps.app.outputs.ready == 'true'
        working-directory: backend
        run: |
          test "$APP_ENV" = testing
          test "$DB_DATABASE" = shopnext_ci_test
          php artisan migrate:fresh --force --no-interaction
      - name: Pest on MySQL (not SQLite)
        if: steps.app.outputs.ready == 'true'
        working-directory: backend
        run: vendor/bin/pest --ci
